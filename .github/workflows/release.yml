name: Validate Apple Silicon MVP
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify native Apple Silicon Node
        run: node -e "if (process.arch !== 'arm64') process.exit(1)"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:load
      - run: npm run build:mac:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-chat-ppt-remote-arm64
          path: dist/*.zip
