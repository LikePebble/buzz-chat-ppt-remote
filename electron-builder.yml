appId: io.github.likepebble.buzz-chat-ppt-remote
productName: Buzz Chat PPT Remote
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - LICENSE.txt
  - LICENSE_NOTES.md
  - THIRD_PARTY_NOTICES.txt
extraResources:
  - from: out/source.tar.gz
    to: source.tar.gz
mac:
  identity: '-'
  entitlements: build/entitlements.buzz.plist
  entitlementsInherit: build/entitlements.buzz.plist
  category: public.app-category.productivity
  minimumSystemVersion: '12.0'
  notarize: false
  extendInfo:
    NSAppleEventsUsageDescription: Control PowerPoint presentations using fixed keyboard commands.
    NSLocalNetworkUsageDescription: Allow audience phones on the same Wi-Fi to join your presentation room.
  target:
    - target: zip
      arch: [arm64]
  artifactName: Buzz-Chat-PPT-Remote-${version}-${arch}.${ext}
npmRebuild: false
